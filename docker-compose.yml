version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file: .env  # DATABASE_URL del pooler de Supabase + SECRET_KEY, etc.
    environment:
      - FLASK_ENV=development
      - MAIL_ENABLED=0
    volumes:
      - .:/app
    command: gunicorn --bind 0.0.0.0:5000 --reload --worker-class gthread app:app

  # BD opcional para desarrollo 100% offline. En producción se usa Supabase
  # (DATABASE_URL al pooler); en dev, sin DATABASE_URL, corre SQLite local.
  db:
    image: postgres:15-alpine
    profiles: ["local-db"]
    environment:
      - POSTGRES_USER=beauty
      - POSTGRES_PASSWORD=beauty_pass
      - POSTGRES_DB=beauty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
